name: khmer_docs
description: Official Documentation for KhmerLang built with Jaspr
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  khmer_lang:
    path: ../../cli

  web: any
dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: <4.8.1
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: static
  port: 9099
